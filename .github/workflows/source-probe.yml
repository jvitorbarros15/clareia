name: Source probe
on:
  push:
    branches: [infra/static-publication]
    paths: [scripts/probe-sources.mjs, .github/workflows/source-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-sources.mjs
