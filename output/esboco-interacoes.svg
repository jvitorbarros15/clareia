<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
  <defs>
    <filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3.2"/>
    </filter>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#F7F7F2"/>
      <path d="M0 23.5H24" stroke="#E4E6DC" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <path d="M0 0V7" stroke="#285B42" stroke-width="1.4" opacity=".35"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10" fill="none" stroke="#C2410C" stroke-width="1.8"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe Print", "Comic Sans MS", "Bradley Hand", cursive; fill: #20392D; }
    .t { font-size: 15px; }
    .s { font-size: 12px; fill: #66756B; }
    .h { font-size: 20px; font-weight: 700; }
    .n { font-size: 26px; font-weight: 700; fill: #285B42; }
    .note { font-size: 15px; fill: #C2410C; }
    .ink { fill: none; stroke: #20392D; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .soft { fill: #fff; stroke: #20392D; stroke-width: 2; }
    .acc { fill: #285B42; }
    .accl { fill: #DCEBDD; stroke: #285B42; stroke-width: 2; }
    .red { fill: none; stroke: #C2410C; stroke-width: 2; stroke-dasharray: 6 5; }
  </style>

  <rect width="1500" height="1000" fill="url(#paper)"/>

  <g filter="url(#rough)">
    <!-- browser frame -->
    <rect x="30" y="30" width="1440" height="940" rx="14" class="soft"/>
    <path d="M30 76H1470" class="ink"/>
    <circle cx="58" cy="53" r="7" class="ink"/><circle cx="82" cy="53" r="7" class="ink"/><circle cx="106" cy="53" r="7" class="ink"/>

    <!-- header -->
    <text x="62" y="122" class="h">Clareia</text>
    <rect x="200" y="96" width="760" height="44" rx="22" class="accl"/>
    <circle cx="228" cy="118" r="8" class="ink"/><path d="M234 124l7 7" class="ink"/>
    <text x="252" y="124" class="t">Quem de MG mais gastou com passagens em 2026?</text>
    <rect x="852" y="102" width="100" height="32" rx="16" class="acc"/>
    <text x="864" y="124" class="t" style="fill:#fff">Investigar</text>
    <text x="1010" y="124" class="s">Metodologia · Fontes</text>
    <rect x="1300" y="100" width="140" height="36" rx="8" class="ink"/>
    <text x="1314" y="124" class="s">Câmara · 2026 ▾</text>

    <!-- investigation assistant panel -->
    <rect x="200" y="152" width="760" height="270" rx="12" class="soft"/>
    <text x="222" y="182" class="s">CADERNO DE INVESTIGAÇÃO</text>
    <!-- steps -->
    <circle cx="232" cy="210" r="9" class="acc"/><path d="M227 210l4 4 6-8" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="252" y="215" class="t">Entendi: gastos · passagens aéreas · UF = MG · jan–set 2026</text>
    <circle cx="232" cy="240" r="9" class="acc"/><path d="M227 240l4 4 6-8" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="252" y="245" class="t">Consultei 53 deputados · 1.204 registros</text>
    <circle cx="232" cy="270" r="9" class="acc"/><path d="M227 270l4 4 6-8" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="252" y="275" class="t">Conferi o total contra a fonte</text>
    <path d="M232 220V230M232 250V260" class="ink"/>
    <!-- answer -->
    <rect x="222" y="292" width="716" height="78" rx="10" class="accl"/>
    <circle cx="258" cy="331" r="24" fill="url(#hatch)" stroke="#20392D" stroke-width="2"/>
    <text x="294" y="322" class="t">Deputada Fictícia A (PXX-MG) lidera</text>
    <text x="294" y="352" class="n">R$ 148.320</text>
    <rect x="470" y="333" width="178" height="26" rx="13" class="ink" style="stroke:#285B42"/>
    <text x="480" y="351" class="s" style="fill:#285B42">? Como chegamos nisso</text>
    <!-- clues -->
    <text x="222" y="398" class="s">Próximas pistas:</text>
    <rect x="330" y="381" width="110" height="26" rx="13" class="ink"/><text x="345" y="399" class="s">Comparar com…</text>
    <rect x="452" y="381" width="100" height="26" rx="13" class="ink"/><text x="466" y="399" class="s">Ver por mês</text>
    <rect x="564" y="381" width="104" height="26" rx="13" class="ink"/><text x="578" y="399" class="s">Abrir perfil</text>
    <rect x="680" y="381" width="120" height="26" rx="13" class="ink"/><text x="694" y="399" class="s">Ver registros</text>

    <!-- context chips -->
    <text x="62" y="470" class="s">Recorte:</text>
    <rect x="130" y="452" width="76" height="28" rx="14" class="acc"/><text x="140" y="471" class="s" style="fill:#fff">Todas UF</text>
    <rect x="210" y="452" width="40" height="28" rx="14" class="ink"/><text x="219" y="471" class="s">MG</text>
    <rect x="260" y="452" width="40" height="28" rx="14" class="ink"/><text x="270" y="471" class="s">SP</text>
    <rect x="310" y="452" width="40" height="28" rx="14" class="ink"/><text x="320" y="471" class="s">BA</text>
    <rect x="980" y="452" width="250" height="30" rx="15" class="ink"/>
    <rect x="982" y="454" width="90" height="26" rx="13" class="acc"/>
    <text x="996" y="472" class="s" style="fill:#fff">Total</text>
    <text x="1084" y="472" class="s">Por mês</text><text x="1158" y="472" class="s">Passagens</text>
    <rect x="1250" y="452" width="190" height="30" rx="15" class="red" style="stroke-dasharray:none;stroke:#C2410C"/>
    <text x="1268" y="472" class="s" style="fill:#C2410C">Adivinhe primeiro</text>

    <!-- three ranking columns -->
    <g>
      <rect x="62" y="500" width="440" height="440" rx="12" class="soft"/>
      <text x="84" y="534" class="h">Quem mais gastou</text>
      <text x="84" y="556" class="s">Reembolsos da cota · jan–set 2026</text>
      <rect x="80" y="572" width="404" height="80" rx="10" class="accl"/>
      <text x="92" y="618" class="h">1</text>
      <rect x="116" y="584" width="54" height="58" rx="8" fill="url(#hatch)" stroke="#20392D" stroke-width="2"/>
      <text x="184" y="604" class="t">Fictício B</text><text x="184" y="624" class="s">PXX · SP</text>
      <text x="340" y="616" class="n" style="font-size:22px">R$ 412 mil</text>
      <text x="184" y="642" class="s" style="fill:#285B42">achado: 62% em passagens</text>
      <rect x="80" y="664" width="404" height="70" rx="10" class="ink"/>
      <text x="92" y="706" class="h">2</text>
      <rect x="116" y="672" width="48" height="54" rx="8" fill="url(#hatch)" stroke="#20392D" stroke-width="2"/>
      <text x="178" y="694" class="t">Fictícia C</text><text x="178" y="714" class="s">PYY · BA  ▲2</text>
      <text x="340" y="706" class="n" style="font-size:22px">R$ 398 mil</text>
      <rect x="80" y="746" width="404" height="70" rx="10" class="ink"/>
      <text x="92" y="788" class="h">3</text>
      <rect x="116" y="754" width="48" height="54" rx="8" fill="url(#hatch)" stroke="#20392D" stroke-width="2"/>
      <text x="178" y="776" class="t">Fictício D</text><text x="178" y="796" class="s">PZZ · MG  ▼1</text>
      <text x="340" y="788" class="n" style="font-size:22px">R$ 377 mil</text>
      <text x="84" y="860" class="s">Ver ranking completo →</text>
      <path d="M92 890h380" class="ink" stroke-dasharray="3 6"/>
    </g>
    <g>
      <rect x="530" y="500" width="440" height="440" rx="12" class="soft"/>
      <text x="552" y="534" class="h">Quem menos gastou</text>
      <text x="552" y="556" class="s">Mesmo universo · ≥ 6 meses em exercício</text>
      <rect x="548" y="572" width="404" height="70" rx="10" class="ink"/>
      <rect x="584" y="580" width="48" height="54" rx="8" fill="url(#hatch)" stroke="#20392D" stroke-width="2"/>
      <text x="560" y="614" class="h">1</text><text x="646" y="604" class="t">Fictícia E</text>
      <text x="820" y="614" class="n" style="font-size:22px">R$ 41 mil</text>
      <rect x="548" y="654" width="404" height="70" rx="10" class="ink"/>
      <rect x="584" y="662" width="48" height="54" rx="8" fill="url(#hatch)" stroke="#20392D" stroke-width="2"/>
      <text x="560" y="696" class="h">2</text><text x="646" y="686" class="t">Fictício F</text>
      <text x="820" y="696" class="n" style="font-size:22px">R$ 58 mil</text>
      <!-- guess overlay -->
      <rect x="548" y="736" width="404" height="70" rx="10" class="red"/>
      <text x="610" y="778" class="t" style="fill:#C2410C">? ? ?  toque para revelar</text>
    </g>
    <g>
      <rect x="998" y="500" width="442" height="440" rx="12" class="soft"/>
      <text x="1020" y="534" class="h">Quem apresentou mais projetos</text>
      <text x="1020" y="556" class="s">Projetos de lei · autoria principal</text>
      <rect x="1016" y="572" width="406" height="70" rx="10" class="ink"/>
      <rect x="1052" y="580" width="48" height="54" rx="8" fill="url(#hatch)" stroke="#20392D" stroke-width="2"/>
      <text x="1028" y="614" class="h">1</text><text x="1114" y="604" class="t">Fictício G</text>
      <text x="1330" y="614" class="n" style="font-size:22px">87</text>
      <!-- how panel popover -->
      <rect x="1030" y="660" width="390" height="250" rx="12" fill="#FFFBF2" stroke="#285B42" stroke-width="2.4"/>
      <text x="1050" y="690" class="h" style="font-size:17px">Como chegamos nisso?</text>
      <text x="1050" y="716" class="s">R$ 412 mil = soma dos reembolsos líquidos</text>
      <rect x="1050" y="732" width="300" height="20" rx="4" fill="url(#hatch)" stroke="#20392D" stroke-width="1.6"/>
      <text x="1358" y="747" class="s">bruto</text>
      <rect x="1050" y="760" width="40" height="20" rx="4" fill="#F3D6C5" stroke="#C2410C" stroke-width="1.6"/>
      <text x="1098" y="775" class="s">− cancelados / glosas</text>
      <rect x="1050" y="788" width="260" height="20" rx="4" class="acc"/>
      <text x="1318" y="803" class="s">= final</text>
      <text x="1050" y="836" class="s">Universo: 513 deputados · 18.340 registros</text>
      <text x="1050" y="858" class="s">Atualizado em 30/10/2026 · Câmara</text>
      <text x="1050" y="890" class="t" style="fill:#285B42">Ver registros →   Fonte oficial ↗</text>
    </g>
  </g>

  <!-- annotations -->
  <text x="990" y="200" class="note">① a busca vira investigação:</text>
  <text x="990" y="222" class="note">etapas aparecem uma a uma,</text>
  <text x="990" y="244" class="note">depois a resposta + pistas</text>
  <path d="M985 230C960 240 950 250 940 262" class="red" style="stroke-dasharray:none" marker-end="url(#arrow)"/>

  <text x="990" y="330" class="note">② todo número tem</text>
  <text x="990" y="352" class="note">"Como chegamos nisso?"</text>
  <path d="M990 365C900 420 1000 600 1030 690" class="red" marker-end="url(#arrow)"/>
  <path d="M985 345C800 360 700 350 625 345" class="red" style="stroke-dasharray:none" marker-end="url(#arrow)"/>

  <text x="380" y="458" class="note">③ rankings mudam de métrica</text>
  <text x="380" y="480" class="note">e os cartões reordenam ▲▼</text>
  <path d="M380 486C330 500 300 560 260 600" class="red" style="stroke-dasharray:none" marker-end="url(#arrow)"/>

  <text x="1130" y="430" class="note">aposta antes de revelar</text>
  
  <path d="M1300 436C1330 436 1340 440 1345 448" class="red" style="stroke-dasharray:none" marker-end="url(#arrow)"/>

  <text x="40" y="992" class="s" style="font-size:11px">Esboço · dados e nomes fictícios · Clareia (nome provisório)</text>
</svg>
